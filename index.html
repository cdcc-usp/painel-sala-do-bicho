<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Interativo - Fauna</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="tela">
        <h1>ANIMAIS DA REGIÃO</h1>
        <p class="subtitulo">TOQUE PARA OUVIR OS SONS E CONHECER OS ANIMAIS</p>
        
        <div id="grid-animais" class="grid-container">
            <!-- Cards gerados via JS -->
        </div>

        <!-- SEÇÃO DE VÍDEO (Agora vai ficar com a largura do grid) -->
        <div class="secao-video">
            <h1>ESCREVA ALGO AQUI, OU NÃO</h1>
            <div class="card-video" onclick="abrirModalVideo()">
                <!-- Imagem de capa do vídeo -->
                <img src="https://ciclovivo.com.br/wp-content/uploads/2023/05/mata-atlantica-Du-Zuppani-3.jpeg" alt="Capa do Vídeo">
                <p>▶ Assistir Vídeo</p>
            </div>
        </div>
    </div>

    <!-- MODAL DOS ANIMAIS -->
    <div id="modal-animal" class="modal-overlay" onclick="fecharModalFora(event)">
        <div class="modal-content">
            <button class="btn-fechar" onclick="fecharModal()">×</button>
            <div class="modal-hero">
                <img id="modal-img" src="" alt="Imagem do Animal">
            </div>
            <div class="modal-corpo">
                <div id="modal-status-som" class="tocando-indicador">🔊 Tocando Som do Animal...</div>
                <h2 id="modal-titulo" class="modal-titulo">Nome</h2>
                <div id="modal-cientifico" class="modal-cientifico">Científico</div>
                
                <div class="modal-tags" id="modal-tags-container">
                </div>

                <div id="modal-texto" class="modal-texto">
                </div>

                <div id="modal-fonte" class="modal-fonte">
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DO VÍDEO -->
    <div id="modal-video" class="modal-overlay" onclick="fecharModalVideoFora(event)">
        <div class="modal-content modal-video-content">
            <button class="btn-fechar" onclick="fecharModalVideo()" style="z-index: 10; background: rgba(0,0,0,0.5); color: white;">×</button>
            <video id="player-video" controls>
                <!-- Insira o caminho do seu vídeo aqui -->
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                Seu navegador não suporta o elemento de vídeo.
            </video>
        </div>
    </div>

    <script src="dados/dados.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
